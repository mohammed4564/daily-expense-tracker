
{% extends "base.html" %}

{% block title %}Add Expense - Daily Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card">

    <h2>Add New Expense</h2>
    <p class="subtitle">Enter your expense details</p>

    <form id="expenseForm">

        <div class="form-group">
            <label>Expense Date</label>
            <input type="date" id="expense_date" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Health">Health</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="description"
                   placeholder="Enter description">
        </div>

        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount"
                   min="0.01" step="0.01"
                   placeholder="Enter amount" required>
        </div>

        <button type="submit" class="btn-primary">
            Save Expense
        </button>

        <p id="message" class="message"></p>

    </form>

    <p class="auth-link">
        <a href="/dashboard">Back to Dashboard</a>
    </p>

</div>

{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem("access_token");

if (!token) {
    window.location.href = "/login";
}

// Set today's date as the default.
document.getElementById("expense_date").value =
    new Date().toISOString().slice(0, 10);

document.getElementById("expenseForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message = document.getElementById("message");

        const expenseData = {
            expense_date: document.getElementById("expense_date").value,
            category: document.getElementById("category").value,
            description: document.getElementById("description").value,
            amount: document.getElementById("amount").value
        };

        try {
            const response = await fetch("/api/expenses", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(expenseData)
            });

            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("user");
                window.location.href = "/login";
                return;
            }

            if (response.ok) {
                message.textContent = "Expense added successfully!";
                message.className = "message success";

                document.getElementById("expenseForm").reset();
                document.getElementById("expense_date").value =
                    new Date().toISOString().slice(0, 10);

                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 1000);

            } else {
                message.textContent = data.message || "Unable to save expense";
                message.className = "message error";
            }

        } catch (error) {
            message.textContent = "Unable to connect to the server.";
            message.className = "message error";
            console.error(error);
        }
    }
);
</script>
{% endblock %}
