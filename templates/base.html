
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Daily Expense Tracker{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo">Daily Expense Tracker</div>

        <nav>
            <a href="{{ url_for('login_page') }}">Login</a>
            <a href="{{ url_for('register_page') }}">Register</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Daily Expense Tracker &copy; 2026</p>
    </footer>

    {% block scripts %}{% endblock %}

</body>
</html>
