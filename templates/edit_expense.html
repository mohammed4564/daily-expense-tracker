
{% extends "base.html" %}

{% block title %}Edit Expense - Daily Expense Tracker{% endblock %}

{% block content %}

<div class="auth-card">

    <h2>Edit Expense</h2>
    <p class="subtitle">Update your expense details</p>

    <form id="editExpenseForm">

        <div class="form-group">
            <label>Expense Date</label>
            <input type="date" id="expense_date" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Bus">Bus</option>
                <option value="Metro">Metro</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Health">Health</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="description"
                   placeholder="Enter description">
        </div>

        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount"
                   min="0.01" step="0.01"
                   placeholder="Enter amount" required>
        </div>

        <button type="submit" class="btn-primary" id="updateBtn">
            Update Expense
        </button>

        <p id="message" class="message"></p>

    </form>

    <p class="auth-link">
        <a href="/dashboard">Back to Dashboard</a>
    </p>

</div>

{% endblock %}

{% block scripts %}

<script>
const token = localStorage.getItem("access_token");

// Get expense ID from the URL
const expenseId = window.location.pathname.split("/").pop();

const message = document.getElementById("message");
const updateBtn = document.getElementById("updateBtn");

// Check login
if (!token) {
    window.location.href = "/login";
}

// Load existing expense details
async function loadExpense() {

    try {

        const response = await fetch(
            `/api/expenses/${expenseId}`,
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const data = await response.json();

        if (response.status === 401) {
            localStorage.removeItem("access_token");
            localStorage.removeItem("user");
            window.location.href = "/login";
            return;
        }

        if (!response.ok) {
            message.textContent =
                data.message || "Unable to load expense details.";
            message.className = "message error";
            return;
        }

        // Supports common API response formats
        const expense = data.expense || data.data || data;

        document.getElementById("expense_date").value =
            String(expense.expense_date).slice(0, 10);

        document.getElementById("category").value =
            expense.category;

        document.getElementById("description").value =
            expense.description || "";

        document.getElementById("amount").value =
            expense.amount;

    } catch (error) {

        console.error(error);

        message.textContent = "Unable to connect to the server.";
        message.className = "message error";
    }
}

// Update expense
document.getElementById("editExpenseForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const expenseData = {
            expense_date: document.getElementById("expense_date").value,
            category: document.getElementById("category").value,
            description: document.getElementById("description").value,
            amount: document.getElementById("amount").value
        };

        updateBtn.disabled = true;
        updateBtn.textContent = "Updating...";

        try {

            const response = await fetch(
                `/api/expenses/${expenseId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(expenseData)
                }
            );

            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem("access_token");
                localStorage.removeItem("user");
                window.location.href = "/login";
                return;
            }

            if (response.ok) {

                message.textContent =
                    "Expense updated successfully!";

                message.className = "message success";

                setTimeout(() => {
                    window.location.href = "/dashboard";
                }, 1000);

            } else {

                message.textContent =
                    data.message || "Unable to update expense.";

                message.className = "message error";
            }

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to the server.";

            message.className = "message error";

        } finally {

            updateBtn.disabled = false;
            updateBtn.textContent = "Update Expense";
        }
    }
);

// Load expense when page opens
loadExpense();

</script>

{% endblock %}
