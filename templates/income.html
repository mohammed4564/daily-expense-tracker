
{% extends "base.html" %}

{% block title %}Income Management{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Income Management</h2>
    <p>Manage your salary and other income sources.</p>
</div>

<div class="form-card">
    <h3 id="formTitle">Add Income</h3>

    <form id="incomeForm">
        <input type="hidden" id="income_id">

        <div class="form-group">
            <label>Income Date</label>
            <input type="date" id="income_date" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Salary">Salary</option>
                <option value="Business">Business</option>
                <option value="Freelancing">Freelancing</option>
                <option value="Investment">Investment</option>
                <option value="Interest">Interest</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" id="description"
                   placeholder="Enter description">
        </div>

        <div class="form-group">
            <label>Amount</label>
            <input type="number" id="amount"
                   step="0.01" min="0.01"
                   placeholder="Enter amount" required>
        </div>

        <button type="submit" id="submitBtn">
            Add Income
        </button>

        <button type="button" id="cancelBtn"
                onclick="resetForm()" style="display:none;">
            Cancel
        </button>
    </form>
</div>

<div class="table-card">
    <h3>Income History</h3>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="incomeTable">
                <tr>
                    <td colspan="6">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

{% endblock %}


{% block scripts %}

<script>
const API_URL = "/api/income";

// Change this key if your login page stores
// the JWT token under a different localStorage key.
function getToken() {
    return localStorage.getItem("access_token");
}

async function apiRequest(url, options = {}) {
    const token = getToken();

    if (!token) {
        alert("Please login first.");
        window.location.href = "/login";
        throw new Error("Authentication required");
    }

    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
            ...options.headers
        }
    });

    const result = await response.json();

    if (!response.ok) {
        throw new Error(result.message || "Request failed");
    }

    return result;
}


// LOAD INCOME
async function loadIncome() {
    const table = document.getElementById("incomeTable");

    try {
        const result = await apiRequest(API_URL);

        table.innerHTML = "";

        if (!result.data || result.data.length === 0) {
            table.innerHTML =
                `<tr><td colspan="6">No income records found</td></tr>`;
            return;
        }

        result.data.forEach(item => {
            const row = document.createElement("tr");

            const values = [
                item.income_id,
                item.income_date,
                item.category,
                item.description || "-",
                Number(item.amount).toFixed(2)
            ];

            values.forEach(value => {
                const td = document.createElement("td");
                td.textContent = value;
                row.appendChild(td);
            });

            const actionCell = document.createElement("td");

            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.type = "button";
            editBtn.onclick = () => editIncome(item.income_id);

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.type = "button";
            deleteBtn.onclick = () => deleteIncome(item.income_id);

            actionCell.append(editBtn, deleteBtn);
            row.appendChild(actionCell);

            table.appendChild(row);
        });

    } catch (error) {
        table.innerHTML =
            `<tr><td colspan="6">${error.message}</td></tr>`;
    }
}


// ADD / UPDATE INCOME
document.getElementById("incomeForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const incomeId = document.getElementById("income_id").value;

    const data = {
        income_date: document.getElementById("income_date").value,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value,
        amount: document.getElementById("amount").value
    };

    try {
        if (incomeId) {
            await apiRequest(`${API_URL}/${incomeId}`, {
                method: "PUT",
                body: JSON.stringify(data)
            });

            alert("Income updated successfully");
        } else {
            await apiRequest(API_URL, {
                method: "POST",
                body: JSON.stringify(data)
            });

            alert("Income added successfully");
        }

        resetForm();
        loadIncome();

    } catch (error) {
        alert(error.message);
    }
});


// EDIT INCOME
async function editIncome(id) {
    try {
        const result = await apiRequest(`${API_URL}/${id}`);
        const item = result.data;

        document.getElementById("income_id").value = item.income_id;
        document.getElementById("income_date").value = item.income_date;
        document.getElementById("category").value = item.category;
        document.getElementById("description").value =
            item.description || "";
        document.getElementById("amount").value = item.amount;

        document.getElementById("formTitle").textContent = "Edit Income";
        document.getElementById("submitBtn").textContent = "Update Income";
        document.getElementById("cancelBtn").style.display = "inline-block";

        document.getElementById("incomeForm")
            .scrollIntoView({ behavior: "smooth" });

    } catch (error) {
        alert(error.message);
    }
}


// DELETE INCOME
async function deleteIncome(id) {
    if (!confirm("Are you sure you want to delete this income?")) {
        return;
    }

    try {
        await apiRequest(`${API_URL}/${id}`, {
            method: "DELETE"
        });

        alert("Income deleted successfully");
        loadIncome();

    } catch (error) {
        alert(error.message);
    }
}


// RESET FORM
function resetForm() {
    document.getElementById("incomeForm").reset();
    document.getElementById("income_id").value = "";

    document.getElementById("formTitle").textContent = "Add Income";
    document.getElementById("submitBtn").textContent = "Add Income";
    document.getElementById("cancelBtn").style.display = "none";
}


// INITIAL LOAD
document.addEventListener("DOMContentLoaded", loadIncome);

</script>

{% endblock %}
